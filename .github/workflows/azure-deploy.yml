name: Deploy backend to Azure App Service

# Builds the Django backend's Docker image, pushes it to Azure Container
# Registry, and deploys it to Azure App Service (Web App for Containers).
#
# Required GitHub repository secrets (Settings -> Secrets and variables ->
# Actions):
#   AZURE_ACR_NAME               - Azure Container Registry name (no domain, e.g. "expensetrackeracr26")
#   ACR_USERNAME                 - ACR admin username (Portal -> registry -> Access keys; enable admin user)
#   ACR_PASSWORD                 - ACR admin password (same page)
#   AZURE_WEBAPP_NAME            - Azure App Service (Web App) name
#   AZURE_WEBAPP_PUBLISH_PROFILE - Web App's publish profile XML (Portal -> Web App -> Get publish profile)
#
# Uses ACR admin credentials + a Web App publish profile instead of OIDC —
# switched after repeated AADSTS700213 federated-credential subject
# mismatches. Requires the ACR admin user enabled and, if the Web App has
# Basic Auth (SCM) disabled, re-enabling it for publish-profile deploys to work.

on:
  push:
    branches:
      - main
    paths:
      - "expensetracker/backend/**"
      - ".github/workflows/azure-deploy.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ secrets.AZURE_WEBAPP_NAME }}:latest expensetracker/backend
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ secrets.AZURE_WEBAPP_NAME }}:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ secrets.AZURE_WEBAPP_NAME }}:latest'
